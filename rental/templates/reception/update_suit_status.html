{% extends "rental/base_admin.html" %}
{% block title %}Update Suit Status{% endblock %}
{% block content %}
<div class="container-fluid">
  <h1>Update Suit Status</h1>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Suit</label>
      <div>{{ suit.suit_name }}</div>
    </div>
    <div class="mb-3">
      <label for="status" class="form-label">Status</label>
      <select id="status" name="status" class="form-control">
        <option value="Available">Available</option>
        <option value="Rented">Rented</option>
        <option value="Cleaning">Cleaning</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'reception_inventory' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
